name: snapshot
# Daily Jita 4-4 price snapshot (docs/22 eve-price-snapshot v1), published as an immutable GitHub Release
# `prices-jita44-<market_time>` with the .json.gz, the .json and a SHA256SUMS file. Engines pick the newest release
# at their own release time (docs/22 §3.1). Manual runs can change min_units / band.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      min_units: { description: "min_units (orders with fewer units are dropped)", default: "10" }
      band: { description: "band above p0", default: "0.05" }
permissions:
  contents: write
concurrency: { group: snapshot, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci && npm run build && npm test
      - name: Latest CCP SDE (type universe = published types with a market group; sde_build) — docs/22 coverage
        run: |
          mkdir -p data
          BUILD=$(curl -fsS https://developers.eveonline.com/static-data/tranquility/latest.jsonl | python3 -c "import json,sys;print(json.loads(sys.stdin.readline())['buildNumber'])")
          F="data/eve-online-static-data-$BUILD-jsonl.zip"
          curl -fsSL --retry 3 -o "$F" "https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-$BUILD-jsonl.zip"
          echo "CCP_SDE=$F" >> "$GITHUB_ENV"
          echo "CCP SDE build $BUILD ($(du -h "$F" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - name: Snapshot (ESI, The Forge sell orders at Jita 4-4)
        run: |
          node dist/src/cli.js snapshot --source esi --ccp-sde "$CCP_SDE" \
            --min-units "${{ inputs.min_units || '10' }}" --band "${{ inputs.band || '0.05' }}" \
            --contact "https://github.com/${{ github.repository }}" --out-dir out
          F=$(ls out/prices-*.json); node dist/src/cli.js validate "$F"; node dist/src/cli.js validate "$F.gz"
          (cd out && sha256sum prices-* > SHA256SUMS)
          echo "FILE=$F" >> "$GITHUB_ENV"
      - name: Publish release
        run: |
          ID=$(node -p "require('./$FILE').snapshot_id")
          TAG="prices-$ID"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG exists (snapshots are immutable)"; exit 0; fi
          node -e "const s=require('./$FILE');console.log('Snapshot '+s.snapshot_id+'\n\n- market_time: '+s.market_time+'\n- sde_build: '+s.sde_build+'\n- rule: '+s.rule.name+' v'+s.rule.version+' min_units '+s.rule.min_units+' band '+s.rule.band+'\n- types: '+s.type_count+' priced, '+s.missing.length+' missing of '+s.coverage.types_requested+' requested ('+s.coverage.dataset+', sha256 '+s.coverage.dataset_sha256+')\n- content_hash: '+s.content_hash)" > notes.md
          gh release create "$TAG" out/prices-* out/SHA256SUMS --title "$TAG" --notes-file notes.md
