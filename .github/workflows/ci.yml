name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: CLI round trip (mocked data only; validate the committed example)
        run: node dist/src/cli.js validate examples/prices-jita44-sample.json
  live-smoke:
    # network: ESI + Fuzzwork, a handful of types. Informational, never gates a merge.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci && npm run build
      - run: npm run smoke
        env:
          EVE_MARKET_PRICES_CONTACT: "https://github.com/${{ github.repository }}"
